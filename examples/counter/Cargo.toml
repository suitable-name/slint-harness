[package]
name = "counter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "The smallest Slint app driven by slint-harness"

[features]
# Turns on the harness seams in the app (here: none are needed, the feature only carries the
# debug info switch in build.rs) and the `ui` test target.
ui-harness = ["dep:slint-harness-hooks"]

[dependencies]
slint = { workspace = true, features = ["std", "compat-1-18"] }
slint-harness-hooks = { workspace = true, optional = true }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
slint-harness = { workspace = true }

[[test]]
name = "ui"
harness = false
required-features = ["ui-harness"]

[lints]
workspace = true
